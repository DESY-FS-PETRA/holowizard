dask_options:
  _target_: holowizard.core.src.parameters.dask_options.DaskOptions
  working_dir: "slurm"
  num_worker: 120
  partitions: "maxgpu,psgpu,allgpu"
  constraint: "V100|A100|A6000"  # no P100: torch cu128 needs compute capability >= 7.0
  walltime: "07-00:00:00"
  python_env: None
  check_interval: 120