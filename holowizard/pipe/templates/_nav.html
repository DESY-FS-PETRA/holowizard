{# Navigation menu (logo button + menu), included by all pages. #}
<style>
  /* Colours and radii used by the menu button and menu; defined here so that every page looks the same
     (not all pages define them themselves). Same values as on the overview page. */
  :root {
    --border-radius-md: 6px;
    --border-radius-lg: 10px;
    --color-background-secondary: #f5f4f1;
    --color-border-primary: rgba(0,0,0,0.3);
    --color-border-secondary: rgba(0,0,0,0.15);
    --color-border-tertiary: rgba(0,0,0,0.08);
    --color-text-primary: #1a1a1a;
    --color-text-secondary: #555;
    --color-text-tertiary: #888;
  }
  /* Menu button: logo scaled to the header (heading and toolbar controls are about 27-30 px high),
     clipped to the rounded corners. Overrides the 48 px in the pages' own styles. */
  .topbar .logo-btn { width: 36px; height: 36px; flex-shrink: 0; overflow: hidden; }
  .topbar .logo-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* The page title next to the menu button opens the menu as well */
  .topbar h1 { cursor: pointer; user-select: none; }
  /* "Tools" submenu: a collapsible group inside the navigation menu */
  .nav-group > summary { list-style: none; }
  .nav-group > summary::-webkit-details-marker { display: none; }
  .nav-group .nav-caret { margin-left: auto; transition: transform 0.15s; }
  .nav-group[open] .nav-caret { transform: rotate(90deg); }
  .nav-group > .nav-item:not(summary) { padding-left: 32px; }
</style>
  <div class="nav-wrap">
    <button class="logo-btn" id="logo-btn" aria-label="Menu">
      <img src="/static/logo.png" alt="Logo" style="width:100%; height:100%; object-fit:contain; display:block;">
    </button>
    <div class="nav-menu" id="nav-menu">
      <div class="nav-section">Navigation</div>
      <a class="nav-item" href="/overview">
        <svg viewBox="0 0 14 14" fill="none"><rect x="2" y="3" width="10" height="8" rx="0.8" stroke="currentColor" stroke-width="1.2"/><path d="M2 9l3-3 3 3 2-2 2 2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
        Scan Overview
      </a>
      <a class="nav-item" href="/dashboard">
        <svg viewBox="0 0 14 14" fill="none"><rect x="2" y="2.2" width="10" height="4" rx="0.9" stroke="currentColor" stroke-width="1.2"/><rect x="2" y="7.8" width="10" height="4" rx="0.9" stroke="currentColor" stroke-width="1.2"/><circle cx="4.3" cy="4.2" r="0.7" fill="currentColor"/><circle cx="4.3" cy="9.8" r="0.7" fill="currentColor"/><path d="M7 4.2h3M7 9.8h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        Worker Status
      </a>
      <details class="nav-group"{% if request.url.path in ("/parameter", "/rotation-center", "/tomography") %} open{% endif %}>
        <summary class="nav-item">
          <svg viewBox="0 0 14 14" fill="none"><path d="M8.5 2.5a3 3 0 0 0-3.4 4L2 9.6V12h2.4l3.1-3.1a3 3 0 0 0 4-3.4L9.8 7.2 8 6l-1.2-1.8Z" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>
          Tools
          <svg class="nav-caret" viewBox="0 0 14 14" fill="none"><path d="M5 3l4 4-4 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </summary>
        <a class="nav-item" href="/parameter">
          <svg viewBox="0 0 14 14" fill="none"><path d="M5.6 3.8C3.4 4.5 2.5 6 2.5 7.4c0 1.9 2 3.1 4.5 3.1s4.5-1.2 4.5-3.1c0-1.8-1.4-3.4-3-3.4-1.2 0-1.5 1.2-1.5 2.4v7.1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Phase Retrieval
        </a>
        <a class="nav-item" href="/rotation-center">
          <svg viewBox="0 0 14 14" fill="none"><path d="M11.6 7.6A4.6 4.6 0 1 1 10.1 3.6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M10.6 1.4l-.3 2.6-2.6-.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.1" fill="currentColor"/></svg>
          Rotation center
        </a>
        <a class="nav-item" href="/tomography">
          <svg viewBox="0 0 14 14" fill="none"><path d="M7 1.8 11.8 4.4v5.2L7 12.2 2.2 9.6V4.4Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M2.2 4.4 7 7l4.8-2.6M7 7v5.2" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          Tomography
        </a>
      </details>
      <hr class="nav-divider">
      <a class="nav-item" href="/logout">
        <svg viewBox="0 0 14 14" fill="none"><path d="M6 2H3v10h3M9 4l3 3-3 3M12 7H6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Log out ({{ request.state.user }})
      </a>
    </div>
  </div>
<script>
  // Opening/closing "Tools" must not reach the page's handler that closes the menu on any click.
  document.getElementById('nav-menu').addEventListener('click', e => { if (e.target.closest('summary')) e.stopPropagation(); });
  // Clicking the page title opens/closes the menu like the menu button.
  document.getElementById('nav-menu').closest('.topbar').addEventListener('click', e => {
    if (!e.target.closest('h1')) return;
    e.stopPropagation();
    document.getElementById('nav-menu').classList.toggle('open');
  });
</script>
