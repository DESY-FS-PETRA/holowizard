[build-system]
requires = ["setuptools >= 72.0", "setuptools-git-versioning>=2.0,<3"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true
dev_template = "{tag}.dev{ccount}"
dirty_template = "{tag}.dev{ccount}+dirty"

[tool.setuptools.packages.find]
where = ["."]  # list of folders that contain the packages (["."] by default)

[tool.setuptools.dynamic]
dependencies = {file = "requirements.txt"}

[tool.setuptools.package-data]
"*" = ["logo.png", "*.json", "*.csv", "README.md"]
"holowizard" = ["VERSION"]
"holowizard.workbench.scripts.config" = ["*.ini", "*.yaml", "*.yml", "**/*.yaml", "**/*.yml"]
"holowizard.workbench.templates" = ["*.html"]
"holowizard.workbench" = ["*.yaml" , "*.md"]

[project]
name="holowizard"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "holowizard/forge/LICENSE", "holowizard/core/LICENSE", "holowizard/livereco/LICENSE", "holowizard/workbench/LICENSE"]
keywords = ["near-field holography", "phase retrieval", "tomography"]

authors = [
  {name = "Johannes Dora", email = "johannes.dora@desy.de"},
  {name = "Johannes Hagemann", email = "johannes.hagemann@desy.de"},
  {name = "André Lopes", email="andre.lopes@hereon.de"},
  {name = "Silja Flenner", email="silja.flenner@hereon.de"},
  {name = "Johannes Grün", email="johannes.gruen@desy.de"},
  {name = "Sebastian Eberle", email="sebastian.eberle@desy.de"},
  {name = "Cem Cinar", email = "cem.cinar@tuhh.de"}
]

classifiers = [
  "Programming Language :: Python"
]

maintainers = [
  {name = "Johannes Dora", email = "johannes.dora@hereon.de"},
  {name = "Johannes Grün", email="johannes.gruen@desy.de"},
  {name = "Johannes Hagemann", email = "johannes.hagemann@desy.de"}
]

[project.urls]
Repository = "https://github.com/DESY-FS-PETRA/holowizard"
Paper_ASRM = "https://doi.org/10.1364/OE.514641"
Paper_Autofocus = "https://doi.org/10.1364/OE.544573"
Zenodo = "https://doi.org/10.5281/zenodo.16275927"

[project.scripts]
holowizard_forge_generate_data = "holowizard.forge.scripts.generate_data:main"
holowizard_forge_create_testconfig = "holowizard.forge.scripts.create_testconfig:main"
holowizard_livereco_server_start = "holowizard.livereco.server.main:main"
holowizard_core_create_examples = "holowizard.core.scripts.create_examples:main"
holowizard_workbench_start = "holowizard.workbench.scripts.holopipe:main"
holowizard_workbench_users = "holowizard.workbench.server.auth:main"
holowizard_workbench_reconstruct_scan = "holowizard.workbench.script.reco:main"
# Former names of the commands (the package was called holowizard.pipe), kept for existing scripts
holowizard_pipe_start = "holowizard.workbench.scripts.holopipe:main"
holowizard_pipe_users = "holowizard.workbench.server.auth:main"
holowizard_pipe_reconstruct_scan = "holowizard.workbench.script.reco:main"

[project.optional-dependencies]
dev = [
"ruff",
"pre-commit",
"pytest",
]

[tool.ruff]
line-length = 120
exclude = [
  "holowizard/forge",
  "tests/forge",
]

[tool.ruff.lint]
ignore = ["E722"]

[tool.pytest.ini_options]
markers = [
    "gpu: tests that require a CUDA-capable GPU",
]
